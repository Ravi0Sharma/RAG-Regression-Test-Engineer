[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-regression"
version = "0.1.0"
description = "Single-agent RAG regression-test experiments on SWE-bench"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]
studio = [
    "langgraph==1.2.12",
    "langsmith==0.14.1",
    "langgraph-cli[inmem]==0.4.32",
    "langgraph-api==0.15.1",
]

[project.scripts]
rag-regression = "rag_regression.cli:main"

[tool.setuptools.packages.find]
include = ["rag_regression*"]

[tool.setuptools.package-data]
rag_regression = ["runtime.py"]
